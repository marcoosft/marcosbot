<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dex GO Assistente</title>
<meta name="description" content="Assistente offline para decidir o que fazer com seus Pokémon no Pokémon GO">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dex GO">
<style>
:root {
  --bg:  #0f1117;
  --s1:  #1a1d27;
  --s2:  #22263a;
  --s3:  #2a2f45;
  --bd:  #2e3249;
  --bd2: #3d4466;
  --a:   #dc2626;
  --a2:  #ef4444;
  --a3:  #f87171;
  --al:  #fca5a5;
  --tx:  #e2e8f0;
  --tx2: #c8d0e0;
  --mu:  #7c85a2;
  --mu2: #4a5272;
  --good:#22c55e;
  --warn:#f59e0b;
  --bad: #ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  overscroll-behavior-y:none;
}

header{
  background:linear-gradient(135deg,#1a1d27,#12151f);
  border-bottom:2px solid var(--bd2);
  padding:0 1rem;display:flex;align-items:center;gap:.75rem;
  height:56px;position:sticky;top:0;z-index:100;
  flex-shrink:0;
}
.back-btn{
  width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);
  color:var(--tx2);display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-size:1.1rem;flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--a2),var(--a));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 14px rgba(220,38,38,.35);flex-shrink:0}
.logo h1{font-size:.98rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{font-size:.62rem;color:var(--mu);display:block}

main{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:640px;margin:0 auto;position:relative}

.search-wrap{padding:.85rem 1rem .6rem;flex-shrink:0}
.search-box{
  position:relative;
}
.search-box input{
  width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:14px;
  padding:.8rem 2.6rem .8rem 1rem;color:var(--tx);font-size:1rem;outline:none;
}
.search-box input:focus{border-color:var(--a3)}
.search-box .sicon{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search-hint{font-size:.72rem;color:var(--mu);margin-top:.5rem;padding:0 .1rem}

#results{
  flex:1;overflow-y:auto;padding:0 1rem 1.2rem;
  display:flex;flex-direction:column;gap:.5rem;
}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.6rem;padding:3rem 1.5rem;color:var(--mu);text-align:center;flex:1;
}
.empty-state .big{font-size:2.4rem}
.empty-state p{font-size:.85rem;line-height:1.5}

.result-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:14px;
  padding:.7rem .9rem;display:flex;align-items:center;gap:.75rem;
  cursor:pointer;transition:border-color .15s, transform .1s;
}
.result-card:active{transform:scale(.98)}
.result-card:hover{border-color:var(--bd2)}
.dex-badge{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:800;color:#fff;
}
.rc-info{flex:1;min-width:0}
.rc-name{font-weight:700;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-types{display:flex;gap:.3rem;margin-top:.3rem;flex-wrap:wrap}
.type-chip{
  font-size:.62rem;font-weight:700;color:#fff;padding:.15rem .5rem;border-radius:20px;
  text-transform:uppercase;letter-spacing:.02em;
}
.rc-tags{display:flex;gap:.3rem;flex-shrink:0}
.mini-badge{
  font-size:.62rem;font-weight:800;padding:.25rem .45rem;border-radius:7px;
  background:var(--s2);border:1px solid var(--bd);color:var(--mu);white-space:nowrap;
}
.mini-badge.tier-S{background:rgba(239,68,68,.15);border-color:#ef4444;color:#fca5a5}
.mini-badge.tier-A{background:rgba(245,158,11,.15);border-color:#f59e0b;color:#fcd34d}

/* ---- Detail view ---- */
#detail{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:none;flex-direction:column;
}
#detail.on{display:flex}
.detail-header{
  display:flex;align-items:center;gap:.75rem;padding:0 1rem;height:56px;flex-shrink:0;
  background:linear-gradient(135deg,#1a1d27,#12151f);border-bottom:2px solid var(--bd2);
}
.close-btn{
  width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);
  color:var(--tx2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.detail-header h2{font-size:1rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-body{flex:1;overflow-y:auto;padding:1.1rem 1rem 2.5rem;max-width:640px;width:100%;margin:0 auto}

.detail-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.detail-badge{
  width:72px;height:72px;border-radius:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff;
}
.detail-name{font-size:1.35rem;font-weight:800}
.detail-dex{color:var(--mu);font-size:.78rem;margin-bottom:.4rem}
.detail-types{display:flex;gap:.4rem}

.stats-row{display:flex;gap:.6rem;margin-bottom:1.2rem}
.stat-box{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:.6rem;text-align:center}
.stat-box .v{font-size:1.15rem;font-weight:800}
.stat-box .l{font-size:.65rem;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-top:.15rem}

.evo-chain{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;margin-bottom:1.3rem}
.evo-node{
  background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:.4rem .7rem;
  font-size:.78rem;font-weight:600;cursor:pointer;
}
.evo-node.current{border-color:var(--a3);background:rgba(220,38,38,.12);color:var(--al)}
.evo-arrow{color:var(--mu);font-size:.85rem;display:flex;flex-direction:column;align-items:center}
.evo-arrow small{font-size:.6rem;color:var(--mu)}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:1rem 1.1rem;margin-bottom:.9rem}
.card h3{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.4rem;margin-bottom:.7rem}
.verdict{
  display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.95rem;
  padding:.3rem .7rem;border-radius:9px;margin-bottom:.55rem;
}
.verdict.good{background:rgba(34,197,94,.15);color:#4ade80}
.verdict.mid{background:rgba(245,158,11,.15);color:#fbbf24}
.verdict.bad{background:rgba(239,68,68,.15);color:#f87171}
.card p{font-size:.83rem;line-height:1.55;color:var(--tx2)}
.card p + p{margin-top:.4rem}

.league-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.league-name{width:64px;font-size:.72rem;font-weight:700;color:var(--mu);flex-shrink:0}
.bar-track{flex:1;height:9px;background:var(--s3);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--a3),var(--a))}
.league-score{width:34px;text-align:right;font-size:.75rem;font-weight:700;flex-shrink:0}
.league-empty{font-size:.78rem;color:var(--mu)}

.tier-badge{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:8px;font-weight:800;font-size:.85rem;color:#fff;flex-shrink:0;
}
.tier-badge.S{background:#dc2626}
.tier-badge.A{background:#f59e0b}
.tier-badge.B{background:#3b82f6}
.tier-badge.C{background:#4a5272}
.raid-type-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.raid-type-row .rt-info{font-size:.78rem;color:var(--tx2)}
.raid-type-row .rt-info b{color:var(--tx)}

.disclaimer{font-size:.68rem;color:var(--mu2);text-align:center;line-height:1.5;padding:.5rem 1rem 0}

#loader{display:none;position:fixed;inset:0;background:rgba(15,17,23,.93);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem}
#loader.on{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-spin{width:42px;height:42px;border:3px solid #2a2f45;border-top-color:var(--a2);border-radius:50%;animation:spin .75s linear infinite}
.loader-txt{font-size:.85rem;color:var(--mu)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px}
</style>
<script>if(localStorage.getItem('mb_auth')!=='ok903082'&&sessionStorage.getItem('mb_auth')!=='ok903082')location.replace('../');</script></head>
<body>

<div id="loader"><div class="loader-spin"></div><div class="loader-txt" id="loaderTxt">Carregando…</div></div>

<header>
  <a class="back-btn" href="../" title="Voltar ao painel central">&#8592;</a>
  <div class="logo">
    <div class="logo-icon">🔴</div>
    <div>
      <h1>Dex GO Assistente</h1>
      <small>Evoluir · Batalhar · Doces</small>
    </div>
  </div>
</header>

<main>
  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off"
        placeholder="Buscar Pokémon por nome ou nº…" />
      <span class="sicon">🔍</span>
    </div>
    <div class="search-hint" id="searchHint"></div>
  </div>

  <div id="results"></div>
</main>

<div id="detail">
  <div class="detail-header">
    <button class="close-btn" id="closeDetail">&#8592;</button>
    <h2 id="detailTitle">Pokémon</h2>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
